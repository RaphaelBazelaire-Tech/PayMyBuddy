<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil — Pay My Buddy</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<a href="#main-content" class="skip-link">Aller au contenu</a>

<div th:replace="~{fragments/navbar :: navbar(activePage='profile')}"></div>

<main id="main-content" class="page-wrapper">

  <!-- Alertes flash -->
  <div th:if="${successMsg}" class="alert alert-success" role="status" aria-live="polite">
    <span th:text="${successMsg}"></span>
  </div>
  <div th:if="${errorMsg}" class="alert alert-danger" role="alert" aria-live="assertive">
    <span th:text="${errorMsg}"></span>
  </div>

  <h1 class="sr-only">Mon profil</h1>

  <!-- ── Lignes du profil ──────────────────────────────────── -->
  <div class="profile-rows" style="max-width: 620px;">

    <!-- USERNAME -->
    <div class="profile-row">
      <span class="profile-label">Username</span>
      <span class="profile-value" id="val-username"
            th:text="'@' + ${user.username}">@username</span>
      <button class="profile-chevron"
              type="button"
              aria-expanded="false"
              aria-controls="edit-username"
              onclick="toggleEdit('edit-username', this)">›</button>
    </div>

    <!-- Formulaire inline : modifier username -->
    <div id="edit-username" class="profile-edit-form" role="region" aria-label="Modifier le pseudo">
      <form th:action="@{/profile/update-username}" method="post">
        <label class="sr-only" for="new-username">Nouveau pseudo</label>
        <input id="new-username"
               name="username"
               type="text"
               class="form-input"
               th:value="${user.username}"
               placeholder="Nouveau pseudo"
               required
               aria-required="true"/>
        <div style="display:flex; gap:.75rem; align-items:center;">
          <button type="submit" class="btn btn-orange" style="width:auto;">Enregistrer</button>
          <button type="button" class="btn btn-outline"
                  onclick="toggleEdit('edit-username', document.querySelector('[aria-controls=edit-username]'))">
            Annuler
          </button>
        </div>
      </form>
    </div>

    <!-- MAIL (lecture seule) -->
    <div class="profile-row">
      <span class="profile-label">Mail</span>
      <span class="profile-value" th:text="${user.email}">nom@domain.com</span>
      <span class="profile-chevron" aria-hidden="true" style="cursor:default; opacity:.4;">›</span>
    </div>

    <!-- MOT DE PASSE -->
    <div class="profile-row">
      <span class="profile-label">Mot de passe</span>
      <span class="profile-value">••••••••</span>
      <button class="profile-chevron"
              type="button"
              aria-expanded="false"
              aria-controls="edit-password"
              onclick="toggleEdit('edit-password', this)">›</button>
    </div>

    <!-- Formulaire inline : modifier mot de passe -->
    <div id="edit-password" class="profile-edit-form" role="region" aria-label="Modifier le mot de passe">
      <form th:action="@{/profile/update-password}" method="post">

        <div>
          <label class="sr-only" for="currentPassword">Mot de passe actuel</label>
          <input id="currentPassword"
                 name="currentPassword"
                 type="password"
                 class="form-input"
                 placeholder="Mot de passe actuel"
                 autocomplete="current-password"
                 required aria-required="true"/>
        </div>
        <div>
          <label class="sr-only" for="newPassword">Nouveau mot de passe</label>
          <input id="newPassword"
                 name="newPassword"
                 type="password"
                 class="form-input"
                 placeholder="Nouveau mot de passe"
                 autocomplete="new-password"
                 required aria-required="true"/>
        </div>
        <div>
          <label class="sr-only" for="confirmPassword">Confirmer le mot de passe</label>
          <input id="confirmPassword"
                 name="confirmPassword"
                 type="password"
                 class="form-input"
                 placeholder="Confirmer le mot de passe"
                 autocomplete="new-password"
                 required aria-required="true"/>
        </div>

        <div style="display:flex; gap:.75rem; align-items:center;">
          <button type="submit" class="btn btn-orange" style="width:auto;">Enregistrer</button>
          <button type="button" class="btn btn-outline"
                  onclick="toggleEdit('edit-password', document.querySelector('[aria-controls=edit-password]'))">
            Annuler
          </button>
        </div>

      </form>
    </div>

  </div>

  <!-- ── Bouton Modifier ──────────────────────────────────── -->
  <!--
    Dans la maquette, le bouton "Modifier" est positionné en face de la ligne
    Mot de passe. Il sert de raccourci pour ouvrir directement le formulaire
    de modification du mot de passe.
  -->
  <div class="profile-actions">
    <button type="button"
            class="btn btn-orange"
            onclick="toggleEdit('edit-password', document.querySelector('[aria-controls=edit-password]'))">
      Modifier
    </button>
  </div>

</main>

<!-- Minimal JS : toggle formulaires inline -->
<script>
  function toggleEdit(formId, chevron) {
    const form = document.getElementById(formId);
    const isOpen = form.classList.contains('open');

    // Ferme tous les formulaires ouverts
    document.querySelectorAll('.profile-edit-form.open').forEach(f => {
      f.classList.remove('open');
    });
    document.querySelectorAll('.profile-chevron[aria-expanded="true"]').forEach(btn => {
      btn.setAttribute('aria-expanded', 'false');
      btn.style.color = '';
    });

    // Ouvre/ferme le formulaire ciblé
    if (!isOpen) {
      form.classList.add('open');
      if (chevron && chevron.setAttribute) {
        chevron.setAttribute('aria-expanded', 'true');
        chevron.style.color = '#2B7CE9';
      }
      // Focus sur le premier champ
      const first = form.querySelector('input');
      if (first) first.focus();
    }
  }

  // Si une alerte est présente suite à une soumission, ouvrir le bon formulaire
  (function() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('edit') === 'password') {
      toggleEdit('edit-password',
        document.querySelector('[aria-controls="edit-password"]'));
    }
  })();
</script>

</body>
</html>
